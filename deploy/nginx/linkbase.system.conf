# 系统级 nginx 站点（需 sudo 安装）——外网入口 :80，全部透传到用户态栈 :30177
#
# 安装（一条命令，替换默认站点并重载）：
#   sudo cp deploy/nginx/linkbase.system.conf /etc/nginx/sites-available/linkbase \
#     && sudo ln -sf /etc/nginx/sites-available/linkbase /etc/nginx/sites-enabled/linkbase \
#     && sudo rm -f /etc/nginx/sites-enabled/default \
#     && sudo nginx -t && sudo systemctl reload nginx
#
# 路由细节（静态/反代 :3001/缓存）都在 deploy/nginx/nginx.conf（:30177），
# 这里只做一层透传，不动应用逻辑。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 30m;   # 与 :30177 层对齐（07 §3）

    location / {
        proxy_pass http://127.0.0.1:30177;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # /ws 长连接
        proxy_send_timeout 3600s;
    }
}
