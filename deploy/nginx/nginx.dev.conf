# Linkbase 开发态 nginx（用户态）——对外入口 :30177（dev 态顶替生产，生产恢复见下注释）
# 生产态（nginx.conf，:30177 静态产物）需先 bun run build 再默认 start；dev 全站透传 vite :5173，
# /api、/ws 由 vite 自带 proxy 转发 :3001（apps/web/vite.config.ts）。
# 用法：STACK_CONF=deploy/nginx/nginx.dev.conf ./scripts/stack.sh start
#
# 目的：外网/局域网访问 dev（vite 只听 localhost 时不通），HMR websocket 随透传生效。

worker_processes 1;
pid /workspace/link_base/.run/nginx/nginx.dev.pid;
error_log /workspace/link_base/.run/nginx/error.dev.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /workspace/link_base/.run/nginx/access.dev.log;

  client_max_body_size 30m;   # 与生产层对齐（07 §3）

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 30177;
    listen [::]:30177;
    server_name _;

    location / {
      proxy_pass http://[::1]:5173;   # vite 默认只听 IPv6 localhost
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;   # HMR / /ws 长连接
      proxy_send_timeout 3600s;
    }
  }
}
