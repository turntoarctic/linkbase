# Linkbase 单机 nginx（用户态，无需 sudo）——对外入口 :30177
# 用法见 scripts/stack.sh（start/stop/reload/test/status）
#
# 拓扑（11 §1 变体）：
#   浏览器 ──▶ nginx :30177 ──┬─▶ 静态 SPA（apps/web/dist，未起后端也能打开前端）
#                             └─▶ /api、/ws 反代到 Bun/Hono :3001
#
# 之所以静态与 API 分开：应用栈未启动时前端仍可访问；后端起来后同源免 CORS。

worker_processes 1;
pid /workspace/link_base/.run/nginx/nginx.pid;
error_log /workspace/link_base/.run/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /workspace/link_base/.run/nginx/access.log;

  # 用户态运行：所有临时目录落到仓库内（系统 /var/lib/nginx 不可写）
  client_body_temp_path /workspace/link_base/.run/nginx/client_body;
  proxy_temp_path /workspace/link_base/.run/nginx/proxy;
  fastcgi_temp_path /workspace/link_base/.run/nginx/fastcgi;
  uwsgi_temp_path /workspace/link_base/.run/nginx/uwsgi;
  scgi_temp_path /workspace/link_base/.run/nginx/scgi;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css application/json application/javascript
    text/xml application/xml application/xml+rss application/wasm
    image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream linkbase_api {
    server 127.0.0.1:3001;
    keepalive 32;
  }

  server {
    listen 30177;
    listen [::]:30177;
    server_name _;

    root /workspace/link_base/apps/web/dist;
    index index.html;

    # 与 server maxRequestBodySize 对齐（07 §3）：blob 25MB / 总兜底 30MB
    client_max_body_size 30m;

    # API（含 blobs/health/auth/... 全部 /api/*）
    location ^~ /api/ {
      proxy_pass http://linkbase_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # Yjs WebSocket（Phase 2，09）：提前就位
    location ^~ /ws {
      proxy_pass http://linkbase_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # 哈希静态资源长缓存
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico|wasm)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
      try_files $uri =404;
    }

    # SPA fallback；index.html 不缓存，保证发版即生效
    location / {
      try_files $uri $uri/ /index.html;
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }
  }
}
