# 本地开发依赖（11 §2 的 dev 子集）：仅 PG + Redis，应用用 bun run dev 直接起
# 用法：docker compose -f docker/compose.dev.yml up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: linkbase
      POSTGRES_PASSWORD: linkbase
      POSTGRES_DB: linkbase
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linkbase']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
